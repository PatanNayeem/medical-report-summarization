{% extends "base.html" %}

{% block title %}Login - Medical Report Summarization System{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card glass-panel">
        <div class="auth-header">
            <div class="auth-icon-circle">
                <i class="fa-solid fa-user-lock"></i>
            </div>
            <h2>Doctor Portal Access</h2>
            <p>Sign in to analyze medical reports with RAG & Mistral-7B</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="username"><i class="fa-solid fa-user"></i> Username</label>
                <input type="text" id="username" name="username" class="form-input" placeholder="e.g. doctor" required autofocus>
            </div>

            <div class="form-group">
                <label for="password"><i class="fa-solid fa-key"></i> Password</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit">
                <span>Sign In to Dashboard</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="auth-footer">
            <p>Demo Account: <strong>doctor</strong> / <strong>doctor123</strong></p>
            <p class="mt-2">Don't have an account? <a href="{{ url_for('register') }}">Create Account</a></p>
        </div>
    </div>
</div>
{% endblock %}
